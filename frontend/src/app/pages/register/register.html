<div class="login-wrap d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card shadow-sm border-0" style="max-width: 420px; width: 100%">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="logo-badge mx-auto mb-3"><i class="bi bi-compass"></i></div>
        <h1 class="h4 mb-1">Créer un compte</h1>
        <p class="text-muted small mb-0">Pour sauvegarder des recherches et recevoir des alertes</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="soumettre()" novalidate>
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input class="form-control" formControlName="name" />
        </div>
        <div class="mb-3">
          <label class="form-label">Adresse e-mail</label>
          <input type="email" class="form-control" formControlName="email" autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-control" formControlName="password" autocomplete="new-password" />
        </div>
        <div class="mb-4">
          <label class="form-label">Confirmer le mot de passe</label>
          <input type="password" class="form-control" formControlName="password_confirmation" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="enCours()">
          @if (enCours()) { <span class="spinner-border spinner-border-sm me-2"></span> }
          Créer mon compte
        </button>
      </form>

      <p class="text-center small mt-3 mb-0">
        Déjà inscrit ? <a routerLink="/connexion">Se connecter</a>
      </p>
    </div>
  </div>
</div>
