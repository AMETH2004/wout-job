<div class="login-wrap d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card shadow-sm border-0" style="max-width: 400px; width: 100%">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="logo-badge mx-auto mb-3"><i class="bi bi-compass"></i></div>
        <h1 class="h4 mb-1">WoutJob</h1>
        <p class="text-muted small mb-0">Toutes les offres de stages/emplois, un seul endroit</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="soumettre()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Adresse e-mail</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            autocomplete="username"
          />
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Mot de passe</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="enCours()">
          @if (enCours()) { <span class="spinner-border spinner-border-sm me-2"></span> }
          Se connecter
        </button>
      </form>

      <p class="text-center small mt-3 mb-0">
        Pas de compte ? <a routerLink="/inscription">Inscrivez-vous</a>
      </p>
      <p class="text-muted small text-center mt-2 mb-0">
        Démo : demo&#64;wout-job.test / password
      </p>
    </div>
  </div>
</div>
